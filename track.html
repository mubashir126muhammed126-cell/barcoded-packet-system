<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shipment Tracking</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="tracking-page">

<div class="tracking-wrap">
  <div class="tracking-brand">📦 Barcoded Packet System</div>

  <div class="tracking-card">
    <h1>Shipment Tracking</h1>
    <p class="muted">Check the current shipment status.</p>

    <div id="loading">Loading shipment...</div>
    <div id="result"></div>

    <div class="track-search">
      <input id="manualCode" placeholder="Enter tracking code">
      <button onclick="manualTrack()">Track Shipment</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = "https://xmbabihlrguuqewgilfo.supabase.co";
const SUPABASE_KEY = "sb_publishable_fOgnuaVOZB_4SWGgx1zd2g_QVY84nIH";
const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function esc(v) {
  return String(v ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function fmt(v) {
  return new Date(v).toLocaleString();
}

async function track(code) {
  const loading = document.getElementById("loading");
  const result = document.getElementById("result");

  if (!code) {
    loading.textContent = "";
    result.innerHTML = "<p class='error'>Tracking code is missing.</p>";
    return;
  }

  loading.textContent = "Loading shipment...";
  result.innerHTML = "";

  const { data, error } = await client.rpc("public_track", {
    p_tracking_code: code
  });

  loading.textContent = "";

  if (error) {
    result.innerHTML = "<p class='error'>Shipment not found.</p>";
    return;
  }

  const events = data.events || [];

  result.innerHTML = `
    <div class="track-summary">
      <p class="small">AWB NUMBER</p>
      <h2>${esc(data.awb_number)}</h2>

      <p class="small">CURRENT STATUS</p>
      <div class="big-status">${esc(data.status)}</div>

      <p class="small">SHIPMENT CREATED</p>
      <p>${fmt(data.created_at)}</p>
    </div>

    <h3>Tracking History</h3>

    <div class="timeline">
      ${events.map((e, i) => `
        <div class="timeline-item">
          <div class="dot"></div>
          <div>
            <strong>${esc(e.status)}</strong>
            <p>${esc(e.note || "")}</p>
            <span class="small">${fmt(e.created_at)}</span>
          </div>
        </div>
      `).join("")}
    </div>
  `;
}

function manualTrack() {
  const code = document.getElementById("manualCode").value.trim();
  if (code) track(code);
}

const params = new URLSearchParams(location.search);
const code = params.get("code");

if (code) {
  track(code);
} else {
  document.getElementById("loading").textContent = "";
  document.getElementById("result").innerHTML =
    "<p>Enter your tracking code below.</p>";
}
</script>
</body>
</html>
